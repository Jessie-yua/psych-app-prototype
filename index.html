<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理APP原型 - 动态心情曲线</title>
<style>
:root {
  color-scheme: light;
  --surface: #F7F7F8;
  --surface-muted: #EFEFF2;
  --text: #171717;
  --text-muted: #52525B;
  --border: rgba(23, 23, 23, 0.12);
  --brand: #0FDC78;
  --brand-soft: #E5FFF2;
  --brand-text: #004D26;
  --brand-on: #004D26;
  --accent: #27D2BF;
  --accent-soft: #EAFBF8;
  --accent-text: #0F766E;
  --radius: 8px;
  --radius-card: 12px;
  --radius-full: 999px;
  --spacer-16: 16px;
  --font-sans: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --app-header-home: #FFF6DC;
  --app-header-home-deep: #FBEFC8;
  --app-header-me: #FFF6DC;
  --app-header-me-deep: #FBEFC8;
  --app-header-chat: #F2F5F3;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #E9ECF1;
  font-family: var(--font-sans);
  display: flex;
  justify-content: center;
  padding: 24px 16px;
  min-height: 100vh;
}
.phone {
  width: 320px;
  background: #000;
  border-radius: 40px;
  padding: 10px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.25), 0 2px 8px rgba(0,0,0,0.15);
}
.phone-screen {
  background: var(--surface);
  border-radius: 32px;
  overflow: hidden;
  position: relative;
  height: 620px;
  display: flex;
  flex-direction: column;
}
.notch {
  position: absolute;
  top: 10px; left: 50%;
  transform: translateX(-50%);
  width: 110px; height: 18px;
  background: #000;
  border-radius: 0 0 12px 12px;
  z-index: 10;
}
.statusbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 20px 4px;
  background: var(--app-header-home);
  color: #8A6A28;
  font-size: 11px;
  font-weight: 600;
  transition: background .25s ease;
}
.statusbar.me { background: var(--app-header-me); }
.statusbar.chat { background: var(--app-header-chat); color: var(--text); }
.statusbar .icons { display: flex; gap: 5px; align-items: center; }

.pages { flex: 1; position: relative; overflow: hidden; }
.page {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  opacity: 0; transform: translateX(20px);
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
  overflow: hidden;
}
.page.active { opacity: 1; transform: translateX(0); pointer-events: auto; }

/* ===== HOME ===== */
.mood-header {
  background: linear-gradient(180deg, var(--app-header-home) 0%, var(--app-header-home-deep) 100%);
  padding: 8px 16px 16px; color: #8A6A28;
}
.mood-wave { position: relative; height: 90px; margin-top: 4px; }
.mood-wave svg { width: 100%; height: 100%; display: block; }
.mood-axis {
  display: flex; justify-content: space-between;
  font-size: 11px; color: rgba(138,106,40,0.65);
  margin-top: -2px;
}
.mood-axis span.now { color: #8A6A28; opacity: 1; font-weight: 600; }
.mood-rating { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 13px; }
.mood-rating .grade {
  background: var(--brand); color: var(--brand-on);
  width: 26px; height: 26px; border-radius: var(--radius-full);
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; margin-left: 6px;
}
.mood-rating .grade-select { display: flex; gap: 4px; }
.mood-rating .grade-dot {
  width: 18px; height: 18px; border-radius: var(--radius-full);
  background: rgba(138,106,40,0.1); border: 1px solid rgba(138,106,40,0.4);
  color: #8A6A28; font-size: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all .15s ease;
}
.mood-rating .grade-dot.active { background: var(--brand); color: var(--brand-on); border-color: var(--brand); }
.app-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.app-body::-webkit-scrollbar { width: 0; }
.section-title { padding: 12px 16px 8px; font-weight: 600; font-size: 15px; color: var(--text); }
.doctor-list { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.doctor-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-card); padding: 12px;
  cursor: pointer; transition: all .15s ease; display: flex; gap: 10px;
}
.doctor-card:active { transform: scale(0.98); border-color: var(--brand); }
.doctor-card.expanded { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
.doctor-avatar {
  width: 44px; height: 44px; border-radius: var(--radius-full);
  background: var(--surface-muted); display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 18px; font-weight: 600; color: var(--text-muted);
}
.doctor-info { flex: 1; min-width: 0; }
.doctor-name-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.doctor-name { font-weight: 600; font-size: 14px; color: var(--text); }
.doctor-title { font-size: 11px; color: var(--text-muted); }
.hosp-badge { font-size: 11px; color: var(--brand-text); background: var(--brand-soft); padding: 1px 6px; border-radius: var(--radius); font-weight: 500; }
.third-tag { font-size: 10px; color: var(--accent-text); background: var(--accent-soft); padding: 1px 5px; border-radius: 3px; }
.doctor-hosp { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.doctor-skill { font-size: 12px; color: var(--text); margin-top: 4px; line-height: 1.4; }
.doctor-stats { display: flex; gap: 12px; margin-top: 6px; font-size: 11px; color: var(--text-muted); }
.doctor-stats b { color: var(--text); font-weight: 600; }
.doctor-detail { max-height: 0; overflow: hidden; transition: max-height .2s ease; }
.doctor-card.expanded .doctor-detail { max-height: 100px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.detail-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
.detail-row .label { color: var(--text-muted); }
.detail-row .val { color: var(--text); font-weight: 500; }
.book-btn { margin-top: 6px; width: 100%; background: var(--brand); color: var(--brand-on); border: none; border-radius: var(--radius); padding: 6px 0; font-size: 12px; font-weight: 600; cursor: pointer; }

/* ===== ME ===== */
.profile-header { background: linear-gradient(180deg, var(--app-header-me) 0%, var(--app-header-me-deep) 100%); padding: 6px 16px 18px; color: #8A6A28; }
.profile-top-bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 0 10px; }
.profile-top-bar .icon-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: var(--radius); transition: background .15s ease; }
.profile-top-bar .icon-btn:active { background: rgba(138,106,40,0.12); }
.profile-top-bar .username { font-size: 15px; font-weight: 600; }
.profile-center { display: flex; flex-direction: column; align-items: center; margin-top: 4px; }
.avatar-wrap { width: 66px; height: 66px; border-radius: var(--radius-full); background: rgba(138,106,40,0.1); border: 3px solid rgba(138,106,40,0.45); display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 4px 12px rgba(138,106,40,0.15); cursor: pointer; }
.avatar-wrap svg { width: 100%; height: 100%; }
.follow-stats { margin-top: 10px; font-size: 13px; opacity: 0.92; }
.follow-stats b { font-weight: 600; }
.quick-entries { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); padding: 14px 8px 10px; border-bottom: 6px solid var(--surface-muted); }
.quick-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 6px 4px; border-radius: var(--radius); transition: background .15s ease; }
.quick-item:active { background: var(--surface-muted); }
.quick-item .q-icon { width: 36px; height: 36px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; }
.quick-item .q-icon svg { width: 20px; height: 20px; color: #fff; }
.quick-item .q-label { font-size: 11px; color: var(--text-muted); }
.menu-list { background: var(--surface); }
.menu-item { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .12s ease; gap: 12px; }
.menu-item:last-child { border-bottom: none; }
.menu-item:active { background: var(--surface-muted); }
.menu-item .m-icon { width: 28px; height: 28px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.menu-item .m-icon svg { width: 16px; height: 16px; color: #fff; }
.menu-item .m-label { flex: 1; font-size: 14px; color: var(--text); }
.menu-item .m-arrow { color: var(--text-muted); opacity: 0.5; }
.menu-item .m-arrow svg { width: 16px; height: 16px; }

/* ===== CHAT ===== */
.chat-header {
  background: var(--app-header-chat);
  border-bottom: 1px solid var(--border);
  padding: 8px 12px 10px;
  display: flex; align-items: center;
}
.chat-back { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); border-radius: var(--radius); }
.chat-back:active { background: var(--surface-muted); }
.chat-title-box { flex: 1; text-align: center; }
.chat-title { font-size: 16px; font-weight: 600; color: var(--text); }
.chat-subtitle { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.chat-right-placeholder { width: 28px; }
.chat-body { flex: 1; overflow-y: auto; background: var(--app-header-chat); padding: 12px 12px 8px; -webkit-overflow-scrolling: touch; }
.chat-body::-webkit-scrollbar { width: 0; }
.msg-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: flex-start; }
.msg-row.user { flex-direction: row-reverse; }
.msg-avatar { width: 32px; height: 32px; border-radius: var(--radius-full); flex-shrink: 0; overflow: hidden; background: var(--surface-muted); }
.msg-avatar svg { width: 100%; height: 100%; }
.msg-avatar img.echo-avatar-img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: var(--radius-full); }
.msg-bubble { max-width: 70%; padding: 8px 12px; border-radius: 14px; font-size: 13px; line-height: 1.5; word-break: break-word; }
.msg-row.ai .msg-bubble { background: #fff; color: var(--text); border-top-left-radius: 4px; border: 1px solid var(--border); }
.msg-row.user .msg-bubble { background: #0FDC78; color: #004D26; border-top-right-radius: 4px; font-weight: 500; }
.system-msg { text-align: center; font-size: 11px; color: var(--text-muted); margin: 8px 0 12px; }
.system-msg span { background: var(--surface); padding: 3px 10px; border-radius: var(--radius-full); opacity: 0.8; }
.typing-dots { display: inline-flex; gap: 3px; padding: 4px 0; }
.typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); opacity: 0.4; animation: typingBounce 1.2s infinite ease-in-out; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-5px);opacity:1} }
.chat-input-bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: var(--surface); border-top: 1px solid var(--border); }
.input-btn { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; border-radius: var(--radius-full); flex-shrink: 0; }
.input-btn:active { color: var(--brand); }
.input-btn svg { width: 22px; height: 22px; }
.chat-input { flex: 1; border: 1px solid var(--border); border-radius: var(--radius-full); padding: 7px 14px; font-size: 13px; background: var(--surface); color: var(--text); outline: none; font-family: inherit; }
.chat-input:focus { border-color: var(--brand); }
.voice-hold-btn { flex:1; display:none; align-items:center; justify-content:center; border:1px solid var(--brand); border-radius:var(--radius-full); padding:7px 14px; font-size:13px; color:var(--brand-text); background:var(--brand-soft); font-weight:600; user-select:none; cursor:pointer; transition:background .12s ease; }
.voice-hold-btn.holding { background:var(--brand); color:var(--brand-on); }
.voice-msg-bubble { display:flex; align-items:center; gap:8px; min-width:64px; }
.voice-wave { display:inline-flex; align-items:center; gap:2px; height:16px; }
.voice-wave i { display:block; width:2.5px; border-radius:2px; background:currentColor; opacity:.85; }
.voice-sec { font-size:12px; font-weight:600; }
.panel-bar { display:none; background:var(--surface); border-top:1px solid var(--border); padding:10px 12px 12px; }
.panel-bar.show { display:block; }
.panel-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
.panel-grid.cols3 { grid-template-columns:repeat(3,1fr); }
.panel-item { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 2px; border-radius:var(--radius); cursor:pointer; transition:background .12s ease; }
.panel-item:active { background:var(--surface-muted); }
.panel-item .p-emoji { width:38px; height:38px; border-radius:var(--radius-full); background:var(--surface-muted); display:flex; align-items:center; justify-content:center; font-size:20px; }
.panel-item .p-icon { width:38px; height:38px; border-radius:var(--radius-full); background:var(--surface-muted); display:flex; align-items:center; justify-content:center; color:var(--text-muted); }
.panel-item .p-icon svg { width:20px; height:20px; }
.panel-item .p-label { font-size:11px; color:var(--text-muted); }

/* ===== 周报页（奶黄主题）===== */
.page-weekly { background:#FFF6DC; }
.statusbar.weekly { background:#FFF6DC; color:#8A6A28; border-bottom:1px solid rgba(138,106,40,0.12); }
.statusbar.weekly svg, .statusbar.weekly .icons { color:#8A6A28; }
.weekly-header { display:flex; align-items:center; padding:8px 12px 10px; }
.weekly-back { width:30px; height:30px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#8A6A28; border-radius:var(--radius-full); }
.weekly-back:active { background:rgba(138,106,40,0.1); }
.weekly-title { flex:1; text-align:center; font-size:15px; font-weight:700; color:#8A6A28; letter-spacing:2px; }
.weekly-header .ph { width:30px; }
.weekly-body { flex:1; overflow-y:auto; padding:6px 14px 16px; display:flex; flex-direction:column; gap:12px; }
.weekly-body::-webkit-scrollbar { width:0; }
.week-card { background:#FFFDF3; border:1px solid rgba(138,106,40,0.14); border-radius:var(--radius-card); padding:12px; box-shadow:0 2px 8px rgba(138,106,40,0.08); }
.week-range-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.week-arrow { width:30px; height:30px; border-radius:var(--radius-full); border:1px solid rgba(138,106,40,0.25); background:#FFFCF0; color:#8A6A28; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .12s ease; flex-shrink:0; }
.week-arrow:active { background:#F5E9C4; }
.week-arrow.disabled { opacity:0.35; }
.week-range { font-size:13px; font-weight:700; color:#8A6A28; }
.week-chart { width:100%; height:110px; display:block; }
.week-empty { text-align:center; font-size:12px; color:#B49B57; padding:30px 0 24px; }
.echo-say-row { display:flex; gap:8px; align-items:flex-start; }
.echo-say-row .msg-avatar { width:34px; height:34px; }
.echo-say-title { font-size:12px; color:#8A6A28; margin-bottom:6px; margin-left:2px; }
.echo-say-bubble { background:#FFF8E6; border:1px solid rgba(138,106,40,0.18); border-radius:12px; border-top-left-radius:4px; padding:10px 12px; font-size:13px; line-height:1.65; color:#6B5320; flex:1; }
.mine-say-title { font-size:11px; color:#A98F4C; margin:2px 2px 6px; }
.mine-say-input { width:100%; border:1px solid rgba(138,106,40,0.25); border-radius:var(--radius); background:#FFFDF3; padding:10px 12px; font-size:13px; color:#6B5320; outline:none; font-family:inherit; resize:none; height:64px; line-height:1.5; }
.mine-say-input:focus { border-color:#D9B44A; background:#FFFEF9; }
.mine-say-input::placeholder { color:#C4AD74; }
.mine-say-hint { font-size:10px; color:#C4AD74; margin-top:4px; text-align:right; }

/* ===== 个人资料编辑页 ===== */
.page-profile { background:#FFF6DC; }
.statusbar.profile { background:#FFF6DC; color:#8A6A28; border-bottom:1px solid rgba(138,106,40,0.12); }
.statusbar.profile svg, .statusbar.profile .icons { color:#8A6A28; }
.profile-edit-avatar-wrap { display:flex; flex-direction:column; align-items:center; gap:6px; padding:6px 0 12px; }
.profile-edit-tip { font-size:11px; color:#A98F4C; }
.profile-edit-row { display:flex; align-items:center; justify-content:space-between; background:#FFFDF3; border:1px solid rgba(138,106,40,0.14); border-radius:var(--radius-card); padding:13px 14px; }
.profile-edit-label { font-size:13px; color:#6B5320; font-weight:600; flex-shrink:0; }
.profile-edit-input { flex:1; text-align:right; border:none; background:transparent; font-size:13px; color:#6B5320; outline:none; font-family:inherit; }
.profile-edit-input:focus { color:#8A6A28; }
.profile-edit-val { font-size:13px; color:#6B5320; }
.profile-save-row { display:flex; justify-content:center; padding-top:4px; }
.profile-save-btn { width:100%; background:#D9B44A; color:#4A3A1A; border:none; border-radius:var(--radius-card); padding:11px 0; font-size:14px; font-weight:700; cursor:pointer; transition:background .12s ease; }
.profile-save-btn:active { background:#C9A03A; }

/* 头像弹窗 */
.avatar-popup-mask { position:absolute; inset:0; background:rgba(0,0,0,0.35); display:none; align-items:flex-end; justify-content:center; z-index:40; }
.avatar-popup-mask.show { display:flex; }
.avatar-popup { width:100%; background:#FFFDF3; border-radius:16px 16px 0 0; padding:6px 0 18px; }
.avatar-popup-item { padding:16px; text-align:center; font-size:15px; color:#6B5320; cursor:pointer; transition:background .12s ease; }
.avatar-popup-item:active { background:rgba(138,106,40,0.08); }
.avatar-popup-divider { height:1px; background:rgba(138,106,40,0.14); margin:0 16px; }

/* bottom nav */
.bottom-nav { display: flex; border-top: 1px solid var(--border); background: var(--surface); padding: 6px 0; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; cursor: pointer; color: var(--text-muted); font-size: 11px; transition: color .15s ease; }
.nav-item svg { width: 22px; height: 22px; }
.nav-item.active { color: var(--brand-text); font-weight: 600; }
.home-pill { width: 46px; height: 46px; border-radius: var(--radius-full); background: var(--brand); display: flex; align-items: center; justify-content: center; margin-top: -18px; box-shadow: 0 4px 12px rgba(15,220,120,0.4); }
.home-pill svg { width: 24px; height: 24px; color: var(--brand-on); }

.toast {
  position: absolute;
  bottom: 70px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(0,0,0,0.8); color: #fff;
  padding: 8px 16px; border-radius: var(--radius);
  font-size: 12px; opacity: 0; pointer-events: none;
  transition: all .2s ease; z-index: 50; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div data-app-root>
  <div class="phone">
    <div class="phone-screen" id="phoneScreen">
      <div class="notch"></div>

      <div class="statusbar" id="statusbar">
        <span>●●● 中国移动</span>
        <span id="statusTime">8:16 AM</span>
        <span class="icons">
          <svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor"><rect x="0" y="6" width="2" height="4" rx="0.5"/><rect x="4" y="4" width="2" height="6" rx="0.5"/><rect x="8" y="2" width="2" height="8" rx="0.5"/><rect x="12" y="0" width="2" height="10" rx="0.5"/></svg>
          <svg width="20" height="10" viewBox="0 0 20 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="16" height="9" rx="2" fill="rgba(138,106,40,0.2)"/><rect x="2" y="2" width="8" height="6" rx="1" fill="currentColor"/><rect x="17.5" y="3" width="1.5" height="4" rx="0.5" fill="currentColor"/></svg>
          <span>50%</span>
        </span>
      </div>

      <div class="pages" id="pages">

        <!-- ===== HOME ===== -->
        <div class="page active" data-page="home">
          <div class="mood-header">
            <div class="mood-wave">
              <svg viewBox="0 0 280 90" preserveAspectRatio="none">
                <defs>
                  <linearGradient id="waveFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#0FDC78" stop-opacity="0.3"/>
                    <stop offset="100%" stop-color="#0FDC78" stop-opacity="0"/>
                  </linearGradient>
                </defs>
                <path id="waveFillPath" fill="url(#waveFill)" d=""/>
                <path id="waveLinePath" fill="none" stroke="#0FDC78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d=""/>
                <circle id="waveDot" cx="140" cy="33" r="4" fill="#0FDC78" stroke="#FFF6DC" stroke-width="1.5"/>

<script>
(function(){
  const root = document.querySelector('[data-app-root]');
  const statusbar = document.getElementById('statusbar');
  const toast = document.getElementById('toast');
  let toastTimer;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove('show'), 1500);
  }

  // ===== 页面切换 =====
  function switchPage(target){
    root.querySelectorAll('.page').forEach(p=>p.classList.toggle('active', p.dataset.page===target));
    statusbar.classList.toggle('me', target==='me');
    statusbar.classList.toggle('chat', target==='chat');
    statusbar.classList.toggle('weekly', target==='weekly');
    statusbar.classList.toggle('profile', target==='profile');
    root.querySelector('.bottom-nav').style.display = (target==='weekly'||target==='profile') ? 'none' : 'flex';
    root.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.nav===target));
    if(target==='weekly') renderWeek();
  }
  root.querySelectorAll('.nav-item').forEach(item=>{
    item.addEventListener('click', ()=>switchPage(item.dataset.nav));
  });

  // ===== 动态心情曲线 =====
  const WAVE_W=280, WAVE_H=90, WAVE_TOP=16, WAVE_BOT=74, WAVE_N=64;
  const GRADE_V={A:0.92, B:0.70, C:0.48, D:0.26}; // A→D 等距下降
  let gradeValue=GRADE_V.B, displayedV=gradeValue, rafId=null;
  const waveFillPath=document.getElementById('waveFillPath');
  const waveLinePath=document.getElementById('waveLinePath');
  const waveDot=document.getElementById('waveDot');
  const waveNowText=document.getElementById('waveNowText');
  const axisSpans=document.querySelectorAll('#moodAxis span');

  function fmtHM(d){ return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }

  function buildWave(v, now){
    const curHour=now.getHours()+now.getMinutes()/60;
    let d='';
    for(let i=0;i<=WAVE_N;i++){
      const f=i/WAVE_N;
      const hour=curHour+(f-0.5)*24; // 横轴：现在前12h → 现在后12h
      // 以真实时间驱动的心情基线（两组正弦叠加，模拟一天内的自然起伏）
      let base=0.5+0.30*Math.sin(hour/24*Math.PI*4+0.8)+0.10*Math.sin(hour*1.7+2.1);
      base=Math.max(0.06, Math.min(0.94, base));
      // 在中心位置把曲线平滑拉到当前评级高度
      const w=Math.exp(-Math.pow((f-0.5)/0.075,2)/2);
      const vv=base*(1-w)+v*w;
      const x=(f*WAVE_W).toFixed(1);
      const y=(WAVE_BOT-vv*(WAVE_BOT-WAVE_TOP)).toFixed(1);
      d+=(i?' L':'M')+x+','+y;
    }
    return d;
  }

  function renderWave(v){
    const now=new Date();
    const d=buildWave(v,now);
    waveLinePath.setAttribute('d',d);
    waveFillPath.setAttribute('d',d+' L'+WAVE_W+','+WAVE_H+' L0,'+WAVE_H+' Z');
    const cy=WAVE_BOT-v*(WAVE_BOT-WAVE_TOP);
    waveDot.setAttribute('cy',cy.toFixed(1));
    waveNowText.setAttribute('y',(cy-7).toFixed(1));
    // 5 个刻度：现在-12h、-6h、现在、+6h、+12h

      const td=new Date(now.getTime()+off*3600000);

  function tweenWave(target){
    if(rafId) cancelAnimationFrame(rafId);
    const start=displayedV, t0=performance.now(), dur=200;
    function step(t){
      const k=Math.min(1,(t-t0)/dur);
      const e=1-Math.pow(1-k,3);
      displayedV=start+(target-start)*e;
      renderWave(displayedV);
      if(k<1){ rafId=requestAnimationFrame(step); }
    }
    rafId=requestAnimationFrame(step);
  }

  renderWave(displayedV);

    profileAvatarSvg.innerHTML=svg;
    // 同步到我的页头像
    if(meAvatarSvg) meAvatarSvg.innerHTML=svg.replace('id="profAvBg2"','id="meAvBgR"').replace('url(#profAvBg2)','url(#meAvBgR)');
  }

  // 头像弹窗：点击头像切换显示/隐藏
  profileAvatar.addEventListener('click', ()=>{
    avatarPopup.classList.toggle('show');
  });
  // 点击遮罩关闭
  avatarPopup.addEventListener('click', e=>{
    if(e.target===avatarPopup) avatarPopup.classList.remove('show');
  });
  // 选项处理
  avatarPopupBox.querySelectorAll('.avatar-popup-item').forEach(item=>{
    item.addEventListener('click', e=>{
      e.stopPropagation();
      const op=item.dataset.avatarOp;
      if(op==='random'){
        randomizeAvatar();
        showToast('头像已随机生成 ♡');
      }else{
        showToast('从相册中选择（测试中）');
      }
      avatarPopup.classList.remove('show');
    });
  });

  // 保存用户名
  document.getElementById('profileSave').addEventListener('click', ()=>{
    const v=profileName.value.trim();
    if(!v){ showToast('用户名不能为空'); return; }
    meUsername.textContent=v;
    showToast('保存成功');
  });

  // 返回
  document.getElementById('profileBack').addEventListener('click', ()=>switchPage('me'));

  // 每次进入编辑页同步用户名
  const origSwitchPage=switchPage;
  switchPage=function(target){
    origSwitchPage(target);
    if(target==='profile') syncProfileName();
  };
})();
</script>
</body>
</html>
